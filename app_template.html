<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>四级背卡</title>
<style>
:root{
  --bg:#ffffff; --fg:#111111; --dim:#6b6b6b; --line:#e5e5e5;
  --soft:#f5f5f5; --brand:#111111; --warn:#b45309; --bad:#c0392b; --good:#1a7f37;
  --fs:1;
}
body.night{
  --bg:#101012; --fg:#ededed; --dim:#9a9a9a; --line:#2a2a2e;
  --soft:#1b1b1f; --brand:#ededed; --warn:#e0a33a; --bad:#ff6b5e; --good:#5ddb8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:0 18px 40px}
.view{display:none}
.view.on{display:block}
.hide{display:none !important}

.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
.hd .t{font-size:calc(22px*var(--fs));font-weight:800;letter-spacing:.5px}
.badge{font-size:calc(13px*var(--fs));color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stats>div{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:calc(24px*var(--fs));font-weight:800;line-height:1.1}
.stats span{display:block;font-size:calc(12px*var(--fs));color:var(--dim);margin-top:4px}

.sec{margin:22px 0 0}
.lbl{font-size:calc(13px*var(--fs));color:var(--dim);margin-bottom:8px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  font:inherit;font-size:calc(14px*var(--fs));border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:999px;padding:8px 14px;cursor:pointer
}
.chips button.on{background:var(--brand);color:var(--bg);border-color:var(--brand);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini{
  font:inherit;font-size:calc(13px*var(--fs));border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:10px;padding:7px 12px;cursor:pointer
}
.big{
  display:block;width:100%;margin-top:26px;padding:20px 0;border:none;border-radius:16px;
  background:var(--brand);color:var(--bg);font:inherit;font-size:calc(20px*var(--fs));font-weight:800;letter-spacing:4px;cursor:pointer
}
.ghost{
  display:block;width:100%;margin-top:10px;padding:14px 0;border:1px solid var(--line);border-radius:14px;
  background:var(--bg);color:var(--fg);font:inherit;font-size:calc(15px*var(--fs));cursor:pointer
}
.big.spd{background:var(--fg);color:var(--bg);letter-spacing:2px;font-size:calc(18px*var(--fs));margin-top:18px}
#spWrap>div{transition:transform .18s ease,opacity .18s ease;will-change:transform}
#spFront{font-size:calc(30px*var(--fs))}
#spZh{font-size:calc(19px*var(--fs));color:var(--dim);margin-top:12px;font-weight:600;line-height:1.5;word-break:break-word}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.cal i{width:100%;aspect-ratio:1;min-width:12px;border-radius:3px;background:var(--soft);display:block}
.cal i.l1{background:#c9d9c9}.cal i.l2{background:#8fbd8f}.cal i.l3{background:#4e9d4e}.cal i.l4{background:#27702a}
body.night .cal i.l1{background:#20402a}.cal body.night i.l1{background:#20402a}
body.night .cal i.l2{background:#2f6b3d}
body.night .cal i.l3{background:#46a55c}
body.night .cal i.l4{background:#6fdc8b}
.warn{margin-top:16px;font-size:calc(13px*var(--fs));line-height:1.55;color:var(--warn);border:1px dashed var(--warn);
  border-radius:12px;padding:12px}
.msg{margin-top:14px;font-size:calc(13px*var(--fs));color:var(--dim);text-align:center}
textarea{width:100%;height:90px;font:inherit;font-size:calc(13px*var(--fs));padding:10px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.ft{margin-top:34px;text-align:center;font-size:calc(12px*var(--fs));color:var(--dim);line-height:1.6}

.hd2{display:flex;align-items:center;gap:12px;padding:18px 0 8px}
.prog{flex:1;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog>div{height:100%;width:0;background:var(--brand);transition:width .2s}
.left{font-size:calc(13px*var(--fs));color:var(--dim);min-width:56px;text-align:right}
.modeTag{font-size:calc(12px*var(--fs));color:var(--dim);margin:6px 0 0;text-align:center;letter-spacing:1px}

.cardWrap{margin-top:18px;min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.front{font-size:calc(34px*var(--fs));font-weight:700;line-height:1.35;word-break:break-word;
  padding:26px 6px;letter-spacing:.3px}
.back{width:100%;padding:4px 0}
.ans{font-size:calc(26px*var(--fs));font-weight:800;line-height:1.4;word-break:break-word}
.ex{margin-top:18px;font-size:calc(16px*var(--fs));color:var(--dim);line-height:1.7;text-align:left;
  border-left:3px solid var(--line);padding-left:12px}
.btns{margin-top:18px}
.btns button{display:block;width:100%;padding:18px 0;border-radius:16px;font:inherit;font-size:calc(18px*var(--fs));font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.b1{background:var(--brand) !important;color:var(--bg) !important;border-color:var(--brand) !important;margin-bottom:10px}
.b2{color:var(--bad)}
.b3{color:var(--warn);margin-bottom:10px}
.ghost.on{border-color:var(--fg);color:var(--fg);font-weight:700}
.fsCtl{display:flex;gap:8px;justify-content:center;margin-top:18px}

.doneBox{padding-top:60px;text-align:center}
.doneT{font-size:calc(22px*var(--fs));font-weight:800}
.doneList{margin:26px 0 8px;text-align:left}
.doneList div{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);
  font-size:calc(15px*var(--fs))}
.doneList span:last-child{font-weight:700}
.hint{font-size:calc(13px*var(--fs));color:var(--dim);line-height:1.6;margin:8px 0 14px}
.wList{margin-top:4px}
.wItem{padding:14px 2px;border-bottom:1px solid var(--line)}
.wItem .a{font-size:calc(17px*var(--fs));font-weight:700}
.wItem .b{font-size:calc(13px*var(--fs));color:var(--dim);margin-top:4px}
.wItem .n{float:right;font-size:calc(12px*var(--fs));color:var(--bad);font-weight:700}

/* ---- 倒计时 / 搜索 / 星标 ---- */
.cd{margin:10px 0 0;font-size:calc(13px*var(--fs));color:var(--dim);text-align:center}
.cd b{color:var(--bad);font-size:calc(17px*var(--fs))}
.sItem{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.sItem .l{font-size:calc(16px*var(--fs));font-weight:700}
.sItem .r{font-size:calc(13px*var(--fs));color:var(--dim);text-align:right;flex:1}
.sBox{width:100%;box-sizing:border-box;padding:12px;border-radius:14px;border:1px solid var(--line);
  background:var(--soft);color:var(--fg);font-size:calc(16px*var(--fs));font-family:inherit}
#searchRes{margin-top:6px}
.starOn{color:#e6a100}
.cardWrap{position:relative;touch-action:pan-y}
.cardWrap .front,.cardWrap .back{transition:transform .18s ease,opacity .18s ease;will-change:transform}
.swipeTag{position:absolute;top:8px;font-size:calc(13px*var(--fs));font-weight:700;opacity:0;transition:opacity .1s}
.swipeTag.l{left:10px;color:var(--bad)}
.swipeTag.r{right:10px;color:var(--good)}
</style>
</head>
<body>
<div id="app">

  <section id="vHome" class="view on">
    <div class="hd"><div class="t">四级背卡</div><div class="badge" id="streak">🔥 0 天</div></div>
    <div class="stats">
      <div><b id="sLearned">0</b><span>已学 / __COUNT__</span></div>
      <div><b id="sDue">0</b><span>今天待复习</span></div>
      <div><b id="sToday">0</b><span>今天答了</span></div>
    </div>
    <div class="cd" id="cd"></div>

    <div class="sec">
      <div class="lbl">找一张卡</div>
      <input id="q" class="sBox" placeholder="打英文或中文都行，比如 cut 或 削减">
      <div id="searchRes"></div>
    </div>

    <div class="sec">
      <div class="lbl">怎么背</div>
      <div class="chips" id="modeChips">
        <button data-mode="en2zh" class="on">看英文猜意思</button>
        <button data-mode="zh2en">看中文想英文</button>
        <button data-mode="cloze">例句填空</button>
        <button data-mode="listen">听音辨词</button>
      </div>
    </div>

    <div class="sec">
      <div class="lbl">练哪一类</div>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="sec">
      <div class="lbl">这一轮学几个新词</div>
      <div class="chips" id="numChips">
        <button data-n="5">5</button><button data-n="10" class="on">10</button>
        <button data-n="20">20</button><button data-n="30">30</button>
      </div>
    </div>

    <button id="speedBtn" class="big spd">⚡ 极速刷词</button>
    <div class="hint" style="text-align:center;margin-top:6px">通勤十分钟过一遍：认识的划走，不认识的留到下一轮，直到全认识。</div>

    <button id="startBtn" class="big">开 始</button>
    <button id="goWrong" class="ghost">错题本（<span id="wCount">0</span> 条）</button>
    <button id="starOnlyBtn" class="ghost">只看我收藏的（<span id="sCount">0</span> 条）</button>

    <div class="sec">
      <div class="lbl">打卡日历（最近 8 周）</div>
      <div id="cal" class="cal"></div>
    </div>

    <div class="sec">
      <div class="lbl">设置</div>
      <div class="row">
        <button id="fontDown" class="mini">字小一点</button>
        <button id="fontUp" class="mini">字大一点</button>
        <button id="nightBtn" class="mini">夜间模式</button>
        <button id="exToggle" class="mini">例句：先藏起来</button>
        <button id="backupBtn" class="mini">备份进度</button>
        <button id="importBtn" class="mini">恢复进度</button>
      </div>
    </div>

    <div id="bkWarn" class="warn hide"></div>

    <div id="restoreBox" class="hide" style="margin-top:14px">
      <textarea id="impText" placeholder="把之前生成的备份码粘贴到这里"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="impDo" class="mini">恢复</button>
        <button id="impPick" class="mini">从文件恢复</button>
        <input type="file" id="impFile" accept=".txt,text/plain" hidden>
      </div>
    </div>

    <div id="msg" class="msg hide"></div>
    <div class="ft">共 __COUNT__ 条，全部出自 2026 年 6 月三套四级真题<br>进度存在这台设备上</div>
  </section>

  <section id="vStudy" class="view">
    <div class="hd2">
      <button id="quitBtn" class="mini">← 返回</button>
      <div class="prog"><div id="bar"></div></div>
      <div id="left" class="left">0</div>
    </div>
    <div class="modeTag" id="modeTag"></div>
    <div class="cardWrap" id="cardWrap">
      <div class="swipeTag l">← 想不起来</div>
      <div class="swipeTag r">会 →</div>
      <div id="front" class="front"></div>
      <div id="back" class="back hide">
        <div id="ans" class="ans"></div>
        <div id="sub" class="ex" style="border:none;padding-left:0;text-align:center;margin-top:8px"></div>
        <div id="ex" class="ex hide"></div>
        <div id="exBtnWrap" class="hide" style="margin-top:10px">
          <button id="exBtn" class="mini">看例句</button>
        </div>
        <div style="margin-top:14px"><button id="speakBtn" class="mini">🔊 听发音</button></div>
      </div>
    </div>
    <div class="btns">
      <div id="askBtns">
        <button id="knownBtn" class="b1">我想到了</button>
        <button id="unknownBtn" class="b2">想不起来</button>
      </div>
      <div id="judgeBtns" class="hide">
        <button id="rightBtn" class="b1">确实对 ✓</button>
        <button id="fuzzyBtn" class="b3">有点模糊</button>
        <button id="wrongBtn" class="b2">记错了</button>
      </div>
    </div>
    <div class="fsCtl">
      <button id="undoBtn" class="mini">↶ 撤销上一步</button>
      <button id="starBtn" class="mini">☆ 收藏</button>
      <button id="fsDown" class="mini">字小一点</button>
      <button id="fsUp" class="mini">字大一点</button>
    </div>
    <div class="hint" style="text-align:center">也可以左右滑卡片：往右滑=会，往左滑=不会</div>
  </section>

  <section id="vSpeed" class="view">
    <div class="hd2">
      <button id="spBack" class="mini">← 返回</button>
      <div class="prog"><div id="spBar"></div></div>
      <div id="spLeft" class="left">0</div>
    </div>
    <div class="modeTag" id="spTag"></div>
    <div class="cardWrap" id="spWrap">
      <div class="swipeTag l">← 不认识</div>
      <div class="swipeTag r">认识 →</div>
      <div id="spFront" class="front"></div>
      <div id="spZh"></div>
    </div>
    <div class="btns">
      <button id="spYes" class="b1">认识 ✓</button>
      <button id="spNo" class="b2">不认识</button>
    </div>
    <div class="hint" style="text-align:center">右滑=认识，左滑=不认识。不认识的会留在下一轮再冒出来，直到你全认识为止。</div>
  </section>

  <section id="vDone" class="view">
    <div class="doneBox">
      <div class="doneT" id="doneT">这一轮完了</div>
      <div class="doneList" id="doneList"></div>
      <button id="againBtn" class="big">再来一轮</button>
      <button id="homeBtn" class="ghost">回首页</button>
    </div>
  </section>

  <section id="vWrong" class="view">
    <div class="hd2">
      <button id="wBack" class="mini">← 返回</button>
      <div class="left">错题本</div>
    </div>
    <div class="hint">答错过的卡都在这儿，按错得多少从上往下排。点下面的按钮，只练它们。</div>
    <div id="wList" class="wList"></div>
    <button id="wStart" class="big">狂刷错题</button>
  </section>

</div>

<script>
var DATA = __DATA__;

var LS = 'cet4_col_v1';
var IVL = [1, 3, 7, 15, 30];      /* 天 */
var DAY = 86400000;
var MAX_REPUSH = 2;
var FONTS = [0.85, 1, 1.15, 1.3, 1.45, 1.6];

var CATS = [
  {k:'全部', g:null},
  {k:'搭配', g:['动词+介词','动宾搭配','形容词+介词','名词+介词']},
  {k:'介词短语', g:['介词短语']},
  {k:'非谓语', g:['非谓语']},
  {k:'从句句式', g:['从句句式']},
  {k:'写作模板', g:['写作模板']},
  {k:'翻译', g:['翻译词块','翻译母句']},
  {k:'易混辨析', g:['易混辨析']}
];

var MODES = {
  en2zh:{name:'看英文猜意思'},
  zh2en:{name:'看中文想英文'},
  cloze:{name:'例句填空'},
  listen:{name:'听音辨词'}
};

/* ---------- 存储 ---------- */
var st = loadState();
var round = null;
var TTS = ('speechSynthesis' in window);

function loadState(){
  var def = {items:{}, newPerRound:10, mode:'en2zh', cat:'全部', font:1,
             night:false, hist:{}, ans:0, bkAns:0, storageOk:true,
             stars:{}, starOnly:false, hideEx:true};
  var o = null;
  try{ var raw = localStorage.getItem(LS); if(raw) o = JSON.parse(raw); }catch(e){ def.storageOk = false; }
  if(o && typeof o === 'object'){ for(var k in o){ def[k] = o[k]; } }
  if(!def.items || typeof def.items !== 'object') def.items = {};
  if(!def.hist || typeof def.hist !== 'object') def.hist = {};
  if(!def.stars || typeof def.stars !== 'object') def.stars = {};
  if(typeof def.font !== 'number' || def.font < 0 || def.font >= FONTS.length) def.font = 1;
  return def;
}

function saveState(){
  try{ localStorage.setItem(LS, JSON.stringify(st)); st.storageOk = true; }
  catch(e){ st.storageOk = false; }
  if(!st.storageOk) note('这台手机的浏览器不让存进度，关掉页面就丢了。');
}

/* ---------- 小工具 ---------- */
function $(id){ return document.getElementById(id); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function nowMs(){ return Date.now(); }
function esc(s){ return String(s == null ? '' : s); }
function note(t){
  var m = $('msg');
  m.textContent = t;
  m.classList.remove('hide');
}
function show(v){
  var vs = ['vHome','vStudy','vSpeed','vDone','vWrong'];
  for(var i = 0; i < vs.length; i++){ $(vs[i]).classList.toggle('on', vs[i] === v); }
  window.scrollTo(0, 0);
}

/* ---------- 主题 / 字号 ---------- */
function applyLook(){
  document.documentElement.style.setProperty('--fs', String(FONTS[st.font] || 1));
  document.body.classList.toggle('night', !!st.night);
  var mb = document.querySelector('meta[name=theme-color]');
  if(mb) mb.setAttribute('content', st.night ? '#101012' : '#ffffff');
}

/* ---------- 发音：优先本机朗读，退到有道发音 ---------- */
var curAudio = null;
function speak(text){
  var t = String(text || '').replace(/[（）()【】\[\]]/g, ' ').trim();
  if(!t) return;
  if(TTS){
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-US'; u.rate = 0.9;
      window.speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  try{
    if(curAudio){ curAudio.pause(); }
    curAudio = new Audio('https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(t));
    curAudio.play()['catch'](function(){ note('这台设备放不出声音，可以先用「看英文猜意思」背。'); });
  }catch(e){ note('这台设备放不出声音，可以先用「看英文猜意思」背。'); }
}

/* ---------- 卡片池 ---------- */
function catsOf(key){
  for(var i = 0; i < CATS.length; i++){
    if(CATS[i].k === key) return CATS[i].g;
  }
  return null;
}
function pool(){
  var g = catsOf(st.cat);
  var base = DATA;
  if(st.starOnly){
    base = DATA.filter(function(c){ return st.stars[c.en]; });
    return base;
  }
  if(!g) return base.slice();
  return base.filter(function(c){ return g.indexOf(c.cat) >= 0; });
}
function starCount(){
  var n = 0;
  for(var k in st.stars){ if(st.stars[k]) n++; }
  return n;
}
function itemOf(c){
  if(!st.items[c.en]) st.items[c.en] = {lv:0, due:0, w:0, ans:0, at:0};
  return st.items[c.en];
}
function dueCount(){
  var p = pool(), n = 0, t = nowMs();
  for(var i = 0; i < p.length; i++){
    var it = st.items[p[i].en];
    if(it && it.due && it.due <= t) n++;
  }
  return n;
}
function learnedCount(){
  var p = pool(), n = 0;
  for(var i = 0; i < p.length; i++){ if(st.items[p[i].en]) n++; }
  return n;
}
function wrongList(){
  var g = catsOf(st.cat);
  var arr = DATA.filter(function(c){
    var it = st.items[c.en];
    return it && it.w > 0 && (!g || g.indexOf(c.cat) >= 0);
  });
  arr.sort(function(a, b){ return (st.items[b.en].w - st.items[a.en].w) || (st.items[a.en].due - st.items[b.en].due); });
  return arr;
}

/* ---------- 一轮 ---------- */
function startRound(kind){
  var t = nowMs(), q = [];
  if(kind === 'wrong'){
    var w = wrongList();
    for(var i = 0; i < w.length && i < 40; i++) q.push(w[i]);
    if(!q.length){ note('这一类还没有错题。'); return; }
  }else{
    var p = pool(), due = [], fresh = [];
    for(var j = 0; j < p.length; j++){
      var it = st.items[p[j].en];
      if(it && it.due && it.due <= t) due.push(p[j]);
      else if(!it) fresh.push(p[j]);
    }
    due.sort(function(a, b){ return st.items[a.en].due - st.items[b.en].due; });
    q = due.slice(0, 80);
    for(var k = 0; k < fresh.length && k < st.newPerRound; k++) q.push(fresh[k]);
    if(!q.length){ note('这一类的卡都复习完了，换一类、或把新词数调大一点。'); return; }
  }
  round = {q:q, i:0, ok:0, bad:0, fix:0, fuzzy:0, push:{}, kind:kind,
           mode:st.mode, cat:st.cat, revealed:false, how:null, fallback:false};
  undoBuf = null;
  lastMode = 'normal';
  $('againBtn').textContent = '再来一轮';
  $('modeTag').textContent = MODES[round.mode].name + ' · ' + round.cat;
  show('vStudy');
  renderCard();
}

function blankEx(c){
  var ex = c.ex || '';
  if(!ex || ex.indexOf('______') >= 0) return null;
  var toks = String(c.en || '').toLowerCase().match(/[a-z']+/g) || [];
  while(toks.length && /^(be|being|to|the|a|an|of)$/.test(toks[0])) toks.shift();
  if(!toks.length) return null;
  var low = ex.toLowerCase();
  for(var n = Math.min(4, toks.length); n >= 1; n--){
    for(var i = 0; i + n <= toks.length; i++){
      var cand = toks.slice(i, i + n).join(' ');
      if(cand.length < 3) continue;
      var forms = variants(cand, i + n === toks.length);
      for(var v = 0; v < forms.length; v++){
        var idx = low.indexOf(forms[v]);
        if(idx >= 0) return ex.slice(0, idx) + '______' + ex.slice(idx + forms[v].length);
      }
    }
  }
  return null;
}

/* 英文会变形：engaging / engaged / engages，都要能挖出来 */
function variants(cand, atEnd){
  var out = [cand], parts = cand.split(' ');
  var last = parts[parts.length - 1], head = parts.slice(0, -1).join(' ');
  var pre = head ? head + ' ' : '';
  if(!atEnd) out.push(cand);           /* 词中间出现：只认原型 */
  out.push(pre + last + 's');
  out.push(pre + last + 'ed');
  if(/e$/.test(last)){ out.push(pre + last.slice(0, -1) + 'ing'); }
  else { out.push(pre + last + 'ing'); }
  if(/y$/.test(last)){ out.push(pre + last.slice(0, -1) + 'ies'); }
  if(/e$/.test(last)){ out.push(pre + last + 'd'); }
  return out;
}

function renderCard(){

function grade(c, kind, cap){
  var it = itemOf(c);
  var t = nowMs();
  it.ans = (it.ans || 0) + 1;
  it.at = t;
  st.ans = (st.ans || 0) + 1;
  var k = dayKey();
  st.hist[k] = (st.hist[k] || 0) + 1;
  if(kind === true){
    it.lv = Math.min((it.lv || 0) + 1, cap || 5);
    it.due = t + IVL[Math.min(it.lv - 1, 4)] * DAY;
  }else if(kind === 'fuzzy'){
    /* 模糊：不算会、也不算错，明天再来一次 */
    it.lv = Math.max(1, it.lv || 0);
    it.due = t + DAY;
  }else{
    it.lv = 0;
    it.w = (it.w || 0) + 1;
    it.due = t;
  }
  saveState();
}

/* 撤销用：记下判分之前的样子 */
var undoBuf = null;
function snapshot(c){
  undoBuf = {
    idx: round.i, en: c.en, item: JSON.parse(JSON.stringify(itemOf(c))),
    ans: st.ans || 0, hist: (st.hist[dayKey()] || 0),
    i: round.i, ok: round.ok, bad: round.bad, fix: round.fix, fuzzy: round.fuzzy,
    qlen: round.q.length, push: JSON.parse(JSON.stringify(round.push || {}))
  };
}

function undoLast(){
  if(!undoBuf || !round){ note('没有可以撤销的了。'); return; }
  st.items[undoBuf.en] = undoBuf.item;
  st.ans = undoBuf.ans;
  var k = dayKey();
  if(undoBuf.hist > 0) st.hist[k] = undoBuf.hist; else delete st.hist[k];
  round.i = undoBuf.i; round.ok = undoBuf.ok; round.bad = undoBuf.bad;
  round.fix = undoBuf.fix; round.fuzzy = undoBuf.fuzzy;
  round.q.length = undoBuf.qlen;
  round.push = undoBuf.push;
  undoBuf = null;
  show('vStudy');
  $('modeTag').textContent = MODES[round.mode].name + ' · ' + round.cat;
  renderCard();
  saveState();
  note('上一步已经撤销，重新判这张。');
}

function judge(kind){
  if(!round || !round.revealed) return;
  var c = round.q[round.i];
  snapshot(c);
  if(kind === true){
    round.ok++;
  }else if(kind === 'fuzzy'){
    round.fuzzy++;
  }else{
    round.bad++;
    if(round.how === 'known') round.fix++;
    var key = c.en;
    var pushed = round.push[key] || 0;
    if(pushed < MAX_REPUSH){
      round.push[key] = pushed + 1;
      round.q.push(c);
    }
  }
  grade(c, kind);
  round.i++;
  if(round.i >= round.q.length){ finish(); }
  else{ renderCard(); }
}

function finish(){
  var total = round.ok + round.bad;
  $('doneT').textContent = round.kind === 'wrong' ? '错题刷完了' : '这一轮完了';

function backupCode(){
  var payload = {items:st.items, hist:st.hist, ans:st.ans, newPerRound:st.newPerRound};
  var s = JSON.stringify(payload);
  var b = btoa(unescape(encodeURIComponent(s)));
  return 'CET4BK1.' + b;
}

function doBackup(){
  var code = backupCode();
  var done = function(){
    st.bkAns = st.ans || 0; saveState(); refreshHome();
    $('restoreBox').classList.remove('hide');
    $('impText').value = code;
    $('impText').select();
    note('备份码已生成：长按上面的框复制，发给微信「文件传输助手」。');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){
      st.bkAns = st.ans || 0; saveState(); refreshHome();
      $('restoreBox').classList.remove('hide');
      $('impText').value = code;
      note('备份码已复制到剪贴板，发给微信「文件传输助手」存着。');
    })['catch'](done);
  }else{
    done();
  }
}

function doImport(text){
  if(!text) return;
  var t = String(text).trim();
  if(t.indexOf('CET4BK2.') === 0){
    var obj2 = null;
    try{ obj2 = JSON.parse(decodeURIComponent(escape(atob(t.slice(8))))); }catch(e){ obj2 = null; }
    if(!obj2 || !obj2.d){ note('这串码好像不对，重新复制一次试试。'); return; }
    restoreV2(obj2);
    return;
  }
  if(t.indexOf('CET4BK1.') === 0) t = t.slice(8);
  var obj = null;
  try{ obj = JSON.parse(decodeURIComponent(escape(atob(t)))); }catch(e){ obj = null; }
  if(!obj || !obj.items || typeof obj.items !== 'object'){ note('这串码好像不对，重新复制一次试试。'); return; }
  var old = st.items || {};
  for(var k in obj.items){ old[k] = obj.items[k]; }
  st.items = old;
  if(obj.hist && typeof obj.hist === 'object'){
    for(var d in obj.hist){ st.hist[d] = Math.max(st.hist[d] || 0, obj.hist[d]); }
  }
  st.ans = Math.max(st.ans || 0, obj.ans || 0);
  saveState(); refreshHome();
  note('进度恢复了，共 ' + Object.keys(st.items).length + ' 条有记录。');
}

/* ---------- 左右滑卡：右滑=会，左滑=不会 ---------- */
var sw = {on:false, x0:0, y0:0, dx:0, dy:0, moved:false, blockClick:false};
function inSpeed(){ return $('vSpeed').classList.contains('on'); }
function cardEls(){
  return inSpeed() ? [$('spFront'), $('spZh')] : [$('front'), $('back')];
}
function setSwipe(dx){
  var rot = Math.max(-6, Math.min(6, dx / 26));
  var els = cardEls();
  for(var i = 0; i < els.length; i++){
    els[i].style.transform = dx ? 'translateX(' + dx + 'px) rotate(' + rot + 'deg)' : '';
    els[i].style.opacity = dx ? String(Math.max(0.5, 1 - Math.abs(dx) / 420)) : '';
  }
  var wrap = inSpeed() ? $('spWrap') : $('cardWrap');
  var l = wrap.querySelector('.swipeTag.l'), r = wrap.querySelector('.swipeTag.r');
  if(l) l.style.opacity = dx < -20 ? Math.min(1, -dx / 90) : 0;
  if(r) r.style.opacity = dx > 20 ? Math.min(1, dx / 90) : 0;
}
function resetSwipe(){ sw.on = false; sw.dx = 0; setSwipe(0); }
function swipeStart(e){
  if(inSpeed()){ if(!sp) return; }else if(!round) return;
  var t = e.touches ? e.touches[0] : e;
  sw.on = true; sw.moved = false; sw.dx = 0; sw.x0 = t.clientX; sw.y0 = t.clientY;
}
function swipeMove(e){
  if(!sw.on) return;
  var t = e.touches ? e.touches[0] : e;
  sw.dx = t.clientX - sw.x0;
  sw.dy = t.clientY - sw.y0;
  if(Math.abs(sw.dx) > 8) sw.moved = true;
  if(Math.abs(sw.dx) > Math.abs(sw.dy) && e.cancelable) e.preventDefault();
  setSwipe(sw.dx);
}
function swipeEnd(){
  if(!sw.on) return;
  var dx = sw.dx, moved = sw.moved;
  sw.on = false;
  setSwipe(0);
  if(moved){ sw.blockClick = true; setTimeout(function(){ sw.blockClick = false; }, 350); }
  if(!moved || Math.abs(dx) < 60) return;
  var right = dx > 0;
  if(inSpeed()){ spJudge(right); return; }
  if(!round.revealed) reveal(right ? 'known' : 'unknown');
  else judge(right ? true : false);
}

/* ---------- 极速刷词：认识划走，不认识留到下一轮 ---------- */
var sp = null;
var lastMode = 'normal';
function shuffle(a){
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function startSpeed(){
  var p = shuffle(pool().slice());
  if(!p.length){ note('这一类还没有卡。'); return; }
  lastMode = 'speed';
  sp = {q:p, i:0, round:1, misses:[], done:0, bad:0, ans:0, t0:nowMs()};
  show('vSpeed');
  spRender();
}
function spRender(){
  if(!sp) return;
  var c = sp.q[sp.i];
  $('spFront').textContent = c.en;
  $('spZh').textContent = c.zh;
  $('spLeft').textContent = '剩 ' + (sp.q.length - sp.i);
  $('spBar').style.width = Math.round((sp.i / sp.q.length) * 100) + '%';
  $('spTag').textContent = '⚡ 极速刷词 · 第 ' + sp.round + ' 轮 · 共 ' + sp.q.length +
    ' 张' + (st.starOnly ? ' · 只看收藏' : '');
  setSwipe(0);
}
function spJudge(known){
  if(!sp) return;
  var c = sp.q[sp.i];
  sp.ans++;
  if(known){ grade(c, true, 3); sp.done++; }
  else{ grade(c, false); sp.bad++; sp.misses.push(c); }
  sp.i++;
  if(sp.i < sp.q.length){ spRender(); return; }
  if(sp.misses.length && sp.round < 10){
    var m = sp.misses;
    sp.misses = []; sp.i = 0; sp.round++;
    sp.q = shuffle(m);
    spRender();
    note('第 ' + sp.round + ' 轮：只剩刚才没认出来的 ' + m.length + ' 张。');
    return;
  }
  spFinish();
}
function spFinish(){
  var sec = Math.max(1, Math.round((nowMs() - sp.t0) / 1000));
  var mm = Math.floor(sec / 60), ss = sec % 60;
  var rows = [
    ['刷了几轮', sp.round + ' 轮'],
    ['一共划过', sp.ans + ' 张'],
    ['认出来', sp.done + ' 张'],
    ['还留着', sp.misses.length + ' 张'],
    ['耗时', mm + ' 分 ' + ss + ' 秒'],
    ['平均每张', (sec / Math.max(1, sp.ans)).toFixed(1) + ' 秒'],
    ['今天累计', (st.hist[dayKey()] || 0) + ' 张'],
    ['连续打卡', streakDays() + ' 天']
  ];
  var html = '';
  for(var i = 0; i < rows.length; i++){
    html += '<div><span>' + rows[i][0] + '</span><span>' + rows[i][1] + '</span></div>';
  }
  var left = sp.misses.length;
  sp = null; round = null; lastMode = 'speed';
  $('doneT').textContent = left ? '极速刷词结束' : '全认识了 🎉';
  $('doneList').innerHTML = html;
  $('againBtn').textContent = '再刷一遍';
  show('vDone');
  refreshHome();
}

function idxOf(en){

function backupCode(){
  var t = nowMs(), arr = [];
  for(var en in st.items){
    var i = idxOf(en);
    if(i < 0) continue;
    var it = st.items[en] || {};
    arr.push([i, it.lv || 0, it.w || 0, Math.round(((it.due || t) - t) / DAY), it.ans || 0]);
  }
  var stars = [];
  for(var k in st.stars){ if(st.stars[k]){ var j = idxOf(k); if(j >= 0) stars.push(j); } }
  var payload = {v:2, d:arr, h:st.hist, a:st.ans || 0, n:st.newPerRound || 10, s:stars};
  return 'CET4BK2.' + btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function restoreV2(obj){
  var t = nowMs(), n = 0;
  for(var i = 0; i < (obj.d || []).length; i++){
    var r = obj.d[i];
    var c = DATA[r[0]];
    if(!c) continue;
    st.items[c.en] = {lv:r[1] || 0, w:r[2] || 0, due:t + (r[3] || 0) * DAY, ans:r[4] || 0, at:t};
    n++;
  }
  st.stars = {};
  for(var j = 0; j < (obj.s || []).length; j++){
    var sc = DATA[obj.s[j]];
    if(sc) st.stars[sc.en] = 1;
  }
  if(obj.h && typeof obj.h === 'object'){
    for(var d in obj.h){ st.hist[d] = Math.max(st.hist[d] || 0, obj.h[d]); }
  }
  st.ans = Math.max(st.ans || 0, obj.a || 0);
  if(obj.n) st.newPerRound = obj.n;
  saveState(); refreshHome();
  note('进度恢复了，共 ' + n + ' 条记录、' + starCount() + ' 张收藏。');
}

$('wBack').onclick = goHome;

$('quitBtn').onclick = function(){ goHome(); };
$('againBtn').onclick = function(){
  if(lastMode === 'speed'){ startSpeed(); return; }
  startRound(round ? round.kind : 'normal');
};
$('homeBtn').onclick = goHome;
$('speedBtn').onclick = startSpeed;
$('spYes').onclick = function(){ spJudge(true); };
$('spNo').onclick = function(){ spJudge(false); };
$('spBack').onclick = function(){ sp = null; goHome(); };

$('knownBtn').onclick = function(){ reveal('known'); };
$('unknownBtn').onclick = function(){ reveal('unknown'); };
$('rightBtn').onclick = function(){ judge(true); };
$('fuzzyBtn').onclick = function(){ judge('fuzzy'); };
$('wrongBtn').onclick = function(){ judge(false); };
$('undoBtn').onclick = undoLast;
$('exBtn').onclick = toggleEx;
$('starBtn').onclick = function(){
  if(!round) return;
  var c = round.q[round.i];
  if(st.stars[c.en]){ delete st.stars[c.en]; } else { st.stars[c.en] = 1; }
  saveState();
  $('starBtn').textContent = st.stars[c.en] ? '★ 已收藏' : '☆ 收藏';
  $('starBtn').className = 'mini' + (st.stars[c.en] ? ' starOn' : '');
  refreshHome();
};
$('starOnlyBtn').onclick = function(){
  st.starOnly = !st.starOnly;
  saveState(); buildChips(); refreshHome();
  note(st.starOnly ? '现在只背你收藏的 ' + starCount() + ' 张。' : '已切回全部卡片。');
};
$('exToggle').onclick = function(){
  st.hideEx = !st.hideEx; saveState(); refreshHome();
  note(st.hideEx ? '以后答案先只给中文，例句要点一下才出。' : '以后答案直接把例句一起显示。');

$('front').onclick = function(){
  if(sw.blockClick) return;

};

cw.addEventListener('mousedown', swipeStart);
cw.addEventListener('mousemove', swipeMove);
cw.addEventListener('mouseup', swipeEnd);

var spw = $('spWrap');
spw.addEventListener('touchstart', swipeStart, {passive:true});

$('modeChips').onclick = function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if(!b) return;
  st.mode = b.getAttribute('data-mode'); saveState(); buildChips();
};

  var b = e.target.closest ? e.target.closest('button') : null;
  if(!b) return;
  st.newPerRound = Number(b.getAttribute('data-n')); saveState(); buildChips(); refreshHome();
};

function bumpFont(dir){
  st.font = Math.max(0, Math.min(FONTS.length - 1, (st.font || 1) + dir));
  saveState(); applyLook();
}
$('fontUp').onclick = function(){ bumpFont(1); };
$('fontDown').onclick = function(){ bumpFont(-1); };
$('fsUp').onclick = function(){ bumpFont(1); };
$('fsDown').onclick = function(){ bumpFont(-1); };
$('nightBtn').onclick = function(){ st.night = !st.night; saveState(); applyLook(); };
$('backupBtn').onclick = doBackup;
$('importBtn').onclick = function(){ $('restoreBox').classList.toggle('hide'); };
$('impDo').onclick = function(){ doImport($('impText').value); };
$('impPick').onclick = function(){ $('impFile').click(); };
$('impFile').onchange = function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){ doImport(String(r.result)); };
  r.readAsText(f, 'utf-8');
};

/* ---------- 启动 ---------- */
applyLook();
buildChips();
refreshHome();
if(!st.storageOk){ note('这台设备的浏览器不让存进度，换个浏览器或装 App 版更稳。'); }
